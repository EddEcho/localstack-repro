name: Reproducir error LocalStack machine.json

on:
  workflow_dispatch:

jobs:
  localstack-test:
    runs-on: ubuntu-latest

    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_SESSION_TOKEN: test
      WORKLOAD_NAME: test-workload-1
      APP_NAME: ssawyer-8575
      PLATFORM_VERSION: "2"
      LOCALSTACK_PERSISTENCE: "1"
      LOCALSTACK_SNAPSHOT_LOAD_STRATEGY: MANUAL
      LOCALSTACK_SNAPSHOT_SAVE_STRATEGY: SCHEDULED
      LOCALSTACK_ENABLE_CODEX: "1"
      LOCALSTACK_VOLUME_DIR: ${{ github.workspace }}/.sxm/localstack-volume

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LocalStack 4.3.0 (runtime + CLI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "localstack==4.3.0"
          echo "Runtime & CLI -> $(localstack --version)"

      - name: Ensure volume dir
        run: mkdir -p "$LOCALSTACK_VOLUME_DIR"

      - name: Create dummy machine.json (to reproduce error)
        run: |
          sudo mkdir -p /root/.cache/localstack-cli
          echo '{}' | sudo tee /root/.cache/localstack-cli/machine.json

      - name: Start LocalStack (detached) con DEBUG
        run: |
          DEBUG=1 localstack start --detached \
            --volume $(pwd)/ready.d:/etc/localstack/init/ready.d/00-baseline \
            --volume "$LOCALSTACK_VOLUME_DIR:/var/lib/localstack"
          echo "Esperando que suba…"
          sleep 15

      - name: Print LocalStack logs
        run: localstack logs
